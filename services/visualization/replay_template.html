<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ControlLab Replay</title>
<!--
  ControlLab run replay (docs/CONTROL-LAB.md §10, Phase 6 step 2).
  Generated by services/visualization/replay.py -- the recorded run is
  embedded below as JSON; everything else is plain JS + inline SVG, no
  dependencies, no network.

  Display convention (high-performance HMI style): equipment is drawn in
  grays; a dark fill means running/open, an outline means stopped/closed.
  Color is reserved for abnormal conditions -- red for a trip, amber for a
  warning or for a command that its feedback doesn't (yet) agree with.
-->
<style>
  :root {
    --bg: #e4e5e7; --panel: #f4f5f6; --ink: #22262b; --muted: #6b7178;
    --line: #4a4f55; --run: #3b4652; --hollow: #fbfbfc; --material: #9a8468;
    --trip: #c62828; --warn: #d98e04; --accent: #2f5f8a; --grid: #cfd2d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--grid);
           display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; }
  .verdict { font-weight: 600; }
  .verdict.pass { color: var(--run); } .verdict.fail { color: var(--trip); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--grid); border-radius: 6px; padding: 12px 14px; min-width: 0; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  svg { width: 100%; height: auto; display: block; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; }
  .controls button, .controls select { font: inherit; padding: 4px 10px; border: 1px solid var(--line);
           background: var(--hollow); color: var(--ink); border-radius: 4px; cursor: pointer; }
  .controls button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { flex: 1 1 240px; min-width: 160px; accent-color: var(--accent); }
  .clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 90px; }
  .state { display: inline-block; padding: 3px 10px; border-radius: 4px; font-weight: 700; letter-spacing: .04em;
           border: 2px solid var(--line); background: var(--hollow); }
  .state.running { background: var(--run); color: #fff; border-color: var(--run); }
  .state.faulted, .state.estopped { background: var(--trip); color: #fff; border-color: var(--trip); }
  .state.starting, .state.stopping { border-style: dashed; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.changed td { background: #fff4d6; }
  .alarm-trip td:first-child { border-left: 4px solid var(--trip); }
  .alarm-warn td:first-child { border-left: 4px solid var(--warn); }
  .alarm-cleared { color: var(--muted); }
  .fo { font-size: 11px; font-weight: 700; color: var(--trip); margin-left: 4px; }
  .empty { color: var(--muted); font-style: italic; }
  #events { max-height: 300px; overflow: auto; }
  #events tr { cursor: pointer; }
  #events tr.future td { color: #a3a8ae; }
  #events tr.now td { background: #e3ecf5; font-weight: 600; }
  .side { display: grid; gap: 16px; align-content: start; }
  .tagwrap { max-height: 420px; overflow: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 5px;
                         vertical-align: -2px; border: 1.5px solid var(--line); border-radius: 2px; }
  .legend .l-run::before { background: var(--run); }
  .legend .l-off::before { background: var(--hollow); }
  .legend .l-disc::before { border: 2px dashed var(--warn); }
  .legend .l-trip::before { background: var(--trip); border-color: var(--trip); }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .flowing { animation: flow .6s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .flowing { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="verdict" class="verdict"></span>
  <span id="meta" class="meta"></span>
</header>
<main>
  <div style="display:grid;gap:16px;align-content:start;min-width:0">
    <section aria-label="Line mimic">
      <h2>Line</h2>
      <svg id="mimic" viewBox="0 0 900 360" role="img" aria-label="Line mimic: bin, gate, feeder, conveyor, hopper">
        <defs>
          <clipPath id="bin-clip"><path d="M40 30 H170 V150 L125 190 H85 L40 150 Z"/></clipPath>
          <clipPath id="hop-clip"><path d="M680 110 H820 V270 L775 310 H725 L680 270 Z"/></clipPath>
        </defs>

        <!-- BIN-101 -->
        <g clip-path="url(#bin-clip)"><rect id="bin-fill" x="40" y="190" width="130" height="0" fill="var(--material)"/></g>
        <path id="bin-shell" d="M40 30 H170 V150 L125 190 H85 L40 150 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="105" y="22" text-anchor="middle" font-weight="600">BIN-101</text>
        <text id="lt101" x="182" y="92" font-size="13">LT-101</text>
        <g id="lsl101"><circle cx="30" cy="140" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="22" y="163" font-size="11" text-anchor="middle" fill="var(--muted)">LSL</text></g>

        <!-- XV-102 gate (bowtie valve, vertical flow) -->
        <line x1="105" y1="190" x2="105" y2="205" stroke="var(--line)" stroke-width="2.5"/>
        <path id="xv102" d="M91 205 L119 205 L105 219 Z M91 233 L119 233 L105 219 Z" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text x="128" y="224" font-size="13" font-weight="600">XV-102</text>
        <text id="xv102-txt" x="128" y="240" font-size="12" fill="var(--muted)"></text>

        <!-- M-103 feeder -->
        <rect id="feeder-body" x="70" y="246" width="200" height="26" rx="4" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <line id="feeder-flow" x1="82" y1="259" x2="258" y2="259" stroke="var(--material)" stroke-width="4" stroke-dasharray="10 14" opacity="0"/>
        <circle id="m103" cx="55" cy="300" r="18" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text id="m103-l" x="55" y="305" text-anchor="middle" font-weight="700" font-size="14">M</text>
        <line x1="55" y1="282" x2="75" y2="272" stroke="var(--line)" stroke-width="2"/>
        <text x="80" y="300" font-size="13" font-weight="600">M-103 Feeder</text>
        <text id="m103-txt" x="80" y="316" font-size="12" fill="var(--muted)"></text>

        <!-- M-104 conveyor (inclined) -->
        <path id="conv-belt" d="M285 280 L660 120" stroke="var(--line)" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path d="M285 280 L660 120" stroke="var(--hollow)" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path id="conv-flow" d="M285 280 L660 120" stroke="var(--material)" stroke-width="5" stroke-dasharray="10 14" fill="none" opacity="0"/>
        <circle id="m104" cx="640" cy="170" r="18" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text id="m104-l" x="640" y="175" text-anchor="middle" font-weight="700" font-size="14">M</text>
        <text x="455" y="250" font-size="13" font-weight="600">M-104 Conveyor</text>
        <text id="m104-txt" x="455" y="266" font-size="12" fill="var(--muted)"></text>
        <g id="zss104"><circle cx="380" cy="205" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="368" y="228" font-size="11" fill="var(--muted)">ZSS</text></g>

        <!-- WT-105 hopper -->
        <g clip-path="url(#hop-clip)"><rect id="hop-fill" x="680" y="310" width="140" height="0" fill="var(--material)"/></g>
        <line id="lshh-mark" x1="672" x2="828" stroke="var(--trip)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line id="lsh-mark" x1="672" x2="828" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path id="hop-shell" d="M680 110 H820 V270 L775 310 H725 L680 270 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="750" y="100" text-anchor="middle" font-weight="600">HOPPER</text>
        <text id="wt105" x="750" y="336" text-anchor="middle" font-size="13"></text>
        <g id="lsh105"><circle cx="840" cy="0" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="851" y="4" font-size="11" fill="var(--muted)">LSH</text></g>
        <g id="lshh105"><circle cx="840" cy="0" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="851" y="4" font-size="11" fill="var(--muted)">LSHH</text></g>

        <!-- ES-001 -->
        <circle id="es001" cx="850" cy="40" r="20" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text x="850" y="45" text-anchor="middle" font-size="11" font-weight="700" id="es001-l">E-STOP</text>
        <text x="850" y="76" text-anchor="middle" font-size="12" fill="var(--muted)">ES-001</text>
      </svg>
      <div class="legend">
        <span class="l-run">running / open</span><span class="l-off">stopped / closed</span>
        <span class="l-disc">commanded, not proven</span><span class="l-trip">tripped</span>
      </div>
      <div class="controls">
        <button id="play" type="button" aria-label="Play">▶ Play</button>
        <button id="prev-ev" type="button" title="Previous event (←)">⏮ Event</button>
        <button id="next-ev" type="button" title="Next event (→)">Event ⏭</button>
        <select id="speed" aria-label="Playback speed">
          <option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option><option value="10">10×</option>
        </select>
        <input id="scrub" type="range" min="0" value="0" aria-label="Replay position">
        <span class="clock" id="clock"></span>
        <span class="state" id="state"></span>
      </div>
    </section>
    <section aria-label="Event log">
      <h2>Events</h2>
      <div id="events"></div>
    </section>
  </div>
  <div class="side">
    <section aria-label="Alarms">
      <h2>Alarms</h2>
      <div id="alarms"></div>
    </section>
    <section aria-label="Tags">
      <h2>I/O tags</h2>
      <div class="tagwrap"><table><thead><tr><th>Tag</th><th>Type</th><th class="num">Value</th></tr></thead><tbody id="tags"></tbody></table></div>
    </section>
  </div>
</main>
<script>
const R = /*__REPLAY_DATA__*/null;
const F = R.frames;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const TRIP = "var(--trip)", WARN = "var(--warn)", RUN = "var(--run)", OFF = "var(--hollow)", LINE = "var(--line)";

$("title").textContent = R.title;
document.title = R.title + " · ControlLab Replay";
if ("passed" in R.meta) {
  $("verdict").textContent = R.meta.passed ? "PASS" : "FAIL";
  $("verdict").className = "verdict " + (R.meta.passed ? "pass" : "fail");
}
$("meta").textContent = [R.meta.file, R.meta.detail].filter(Boolean).join(" · ");
$("scrub").max = F.length - 1;

// Hopper geometry: fill spans y 310 (empty) .. 110 (full), a 200px column.
const HOP_TOP = 110, HOP_H = 200, BIN_TOP = 30, BIN_H = 160;
const setpointY = (pct) => HOP_TOP + HOP_H * (1 - pct / 100);
for (const [id, mark, pct] of [["lsh105", "lsh-mark", R.plant.hopper_high_pct], ["lshh105", "lshh-mark", R.plant.hopper_high_high_pct]]) {
  const y = setpointY(pct);
  $(mark).setAttribute("y1", y); $(mark).setAttribute("y2", y);
  $(id).setAttribute("transform", `translate(0 ${y})`);
}

function lamp(groupId, on, color) {
  $(groupId).querySelector("circle").setAttribute("fill", on ? color : OFF);
}

// A device's shape: dark when feedback says running, hollow when stopped,
// dashed amber when the command and the feedback disagree, red on a trip.
function device(el, cmd, fb, trip) {
  el.setAttribute("fill", trip ? TRIP : fb ? RUN : OFF);
  el.setAttribute("stroke", trip ? TRIP : cmd !== fb ? WARN : LINE);
  el.setAttribute("stroke-dasharray", !trip && cmd !== fb ? "6 4" : "none");
}

function renderMimic(v) {
  const binPct = Math.max(0, Math.min(100, v["LT-101"]));
  $("bin-fill").setAttribute("y", BIN_TOP + BIN_H * (1 - binPct / 100));
  $("bin-fill").setAttribute("height", BIN_H * binPct / 100);
  $("lt101").textContent = `LT-101  ${binPct.toFixed(1)} %`;
  lamp("lsl101", v["LSL-101"], WARN);

  const gateOpen = v["ZSO-102"], gateClosed = v["ZSC-102"], gateCmd = v["XV-102.CMD_OPEN"];
  const gateFb = gateOpen ? true : gateClosed ? false : null;  // null = travelling
  const gate = $("xv102");
  gate.setAttribute("fill", gateOpen ? RUN : OFF);
  gate.setAttribute("stroke", gateFb === gateCmd ? LINE : WARN);
  gate.setAttribute("stroke-dasharray", gateFb === gateCmd ? "none" : "6 4");
  $("xv102-txt").textContent = (gateOpen ? "OPEN" : gateClosed ? "CLOSED" : "TRAVELLING") + ` · cmd ${gateCmd ? "open" : "close"}`;

  const fRun = v["M-103.RUNNING"], fCmd = v["M-103.RUN"], fTrip = v["M-103.FAULT"];
  device($("m103"), fCmd, fRun, fTrip);
  $("m103-l").setAttribute("fill", fRun || fTrip ? "#fff" : "var(--ink)");
  $("feeder-body").setAttribute("stroke", fTrip ? TRIP : LINE);
  $("m103-txt").textContent = (fTrip ? "FAULT" : fRun ? "RUNNING" : "STOPPED") + ` · cmd ${fCmd ? "run" : "stop"} · SC-103 ${v["SC-103"].toFixed(0)} %`;

  const cRun = v["M-104.RUNNING"], cCmd = v["M-104.RUN"], cTrip = v["M-104.OL"], motion = v["ZSS-104"];
  device($("m104"), cCmd, cRun, cTrip);
  $("m104-l").setAttribute("fill", cRun || cTrip ? "#fff" : "var(--ink)");
  $("conv-belt").setAttribute("stroke", cTrip ? TRIP : cRun && !motion ? WARN : LINE);
  $("m104-txt").textContent = (cTrip ? "OVERLOAD" : cRun ? "RUNNING" : "STOPPED") + ` · cmd ${cCmd ? "run" : "stop"} · motion ${motion ? "yes" : "no"}`;
  lamp("zss104", motion, RUN);

  // Material only visibly moves where it physically can.
  const feeding = fRun && gateOpen;
  for (const [id, on] of [["feeder-flow", feeding], ["conv-flow", motion]]) {
    $(id).setAttribute("opacity", on ? 1 : 0);
    $(id).classList.toggle("flowing", on && playing);  // belts animate only during playback
  }

  const kg = v["WT-105"], hopPct = Math.max(0, Math.min(100, 100 * kg / R.plant.hopper_capacity_kg));
  $("hop-fill").setAttribute("y", HOP_TOP + HOP_H * (1 - hopPct / 100));
  $("hop-fill").setAttribute("height", HOP_H * hopPct / 100);
  $("wt105").textContent = `WT-105  ${kg.toFixed(0)} kg  (${hopPct.toFixed(1)} %)`;
  lamp("lsh105", v["LSH-105"], WARN);
  lamp("lshh105", v["LSHH-105"], TRIP);

  const healthy = v["ES-001"];
  $("es001").setAttribute("fill", healthy ? OFF : TRIP);
  $("es001").setAttribute("stroke", healthy ? LINE : TRIP);
  $("es001-l").setAttribute("fill", healthy ? "var(--ink)" : "#fff");
}

function fmt(v) { return typeof v === "boolean" ? (v ? "1" : "0") : v.toFixed(2); }

function renderTags(i) {
  const v = F[i].values, prev = i > 0 ? F[i - 1].values : v;
  $("tags").innerHTML = R.tags.map((t) =>
    `<tr class="${v[t.name] !== prev[t.name] ? "changed" : ""}" title="${esc(t.description)}">` +
    `<td>${esc(t.name)}</td><td>${t.type}</td><td class="num">${fmt(v[t.name])}${t.units ? " " + esc(t.units) : ""}</td></tr>`).join("");
}

function renderAlarms(i) {
  const a = F[i].alarms;
  if (!a.length) { $("alarms").innerHTML = '<p class="empty">No latched alarms.</p>'; return; }
  $("alarms").innerHTML = "<table><thead><tr><th>Alarm</th><th>Status</th></tr></thead><tbody>" + a.map((x) =>
    `<tr class="${x.is_warning ? "alarm-warn" : "alarm-trip"} ${x.active ? "" : "alarm-cleared"}">` +
    `<td><strong>${esc(x.id)}</strong>${x.first_out ? '<span class="fo">FIRST OUT</span>' : ""}<br>${esc(x.description)}</td>` +
    `<td>${x.active ? "ACTIVE" : "cleared"} · ${x.acknowledged ? "acked" : "unacked"}</td></tr>`).join("") + "</tbody></table>";
}

function describe(e) {
  switch (e.type) {
    case "command_issued": return `Command: <strong>${esc(e.command)}</strong>`;
    case "state_changed": return `State ${esc(e.from)} → <strong>${esc(e.to)}</strong>` +
      (e.fault_reason && (e.to === "faulted" || e.to === "estopped") ? ` (${esc(e.fault_reason)})` : "");
    case "alarm_activated": return `${e.is_warning ? "Warning" : "Alarm"} <strong>${esc(e.alarm_id)}</strong> active${e.first_out ? " · first out" : ""}`;
    case "alarm_cleared": return `Alarm ${esc(e.alarm_id)} cleared`;
    case "alarm_acknowledged": return `Alarm ${esc(e.alarm_id)} acknowledged`;
    default: return esc(e.type);
  }
}

const whenT = R.meta.when_applied_t;
$("events").innerHTML = R.events.length ? "<table><tbody>" + R.events.map((e, k) =>
  `<tr data-k="${k}"><td class="num">${e.t.toFixed(2)} s</td>` +
  (whenT == null ? "" : `<td>${e.t <= whenT ? "setup" : "response"}</td>`) + `<td>${describe(e)}</td></tr>`).join("") +
  "</tbody></table>" : '<p class="empty">No events recorded.</p>';
const eventFrame = R.events.map((e) => F.findIndex((f) => f.t >= e.t));
document.querySelectorAll("#events tr").forEach((tr) => tr.addEventListener("click", () => show(eventFrame[+tr.dataset.k])));

function renderEvents(i) {
  const t = F[i].t;
  document.querySelectorAll("#events tr").forEach((tr) => {
    const e = R.events[+tr.dataset.k];
    tr.classList.toggle("future", e.t > t);
    tr.classList.toggle("now", F[i].events.includes(+tr.dataset.k));
  });
  const now = document.querySelector("#events tr.now");
  if (now) now.scrollIntoView({ block: "nearest" });
}

let idx = 0, playing = false, timer = null;
function show(i) {
  idx = Math.max(0, Math.min(F.length - 1, i));
  const f = F[idx];
  $("scrub").value = idx;
  $("clock").textContent = `t = ${f.t.toFixed(2)} s`;
  $("state").textContent = f.state.toUpperCase();
  $("state").className = "state " + f.state;
  renderMimic(f.values); renderTags(idx); renderAlarms(idx); renderEvents(idx);
}

function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "⏸ Pause" : "▶ Play";
  $("play").setAttribute("aria-label", on ? "Pause" : "Play");
  clearInterval(timer);
  if (on) {
    if (idx >= F.length - 1) idx = 0;
    const dt = F.length > 1 ? (F[1].t - F[0].t) : 0.1;
    timer = setInterval(() => { if (idx >= F.length - 1) setPlaying(false); else show(idx + 1); }, 1000 * dt / +$("speed").value);
  }
  show(idx);
}

function jumpEvent(dir) {
  const withEvents = F.map((f, i) => (f.events.length ? i : -1)).filter((i) => i >= 0);
  const target = dir > 0 ? withEvents.find((i) => i > idx) : withEvents.reverse().find((i) => i < idx);
  if (target != null) show(target);
}

$("play").addEventListener("click", () => setPlaying(!playing));
$("speed").addEventListener("change", () => { if (playing) setPlaying(true); });
$("scrub").addEventListener("input", (e) => show(+e.target.value));
$("prev-ev").addEventListener("click", () => jumpEvent(-1));
$("next-ev").addEventListener("click", () => jumpEvent(1));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") jumpEvent(1);
  else if (e.key === "ArrowLeft") jumpEvent(-1);
});
show(0);
</script>
</body>
</html>
