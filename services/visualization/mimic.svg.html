<!-- Shared line mimic (Phase 6): included by replay_template.html and live_template.html via page.py. -->
      <svg id="mimic" viewBox="0 0 900 360" role="img" aria-label="Line mimic: three bins with their gates, feeder, conveyor, hopper">
        <defs>
          <clipPath id="bin-clip"><path d="M20 40 H100 V140 L75 170 H45 L20 140 Z"/></clipPath>
          <clipPath id="bin-b-clip"><path d="M115 40 H195 V140 L170 170 H140 L115 140 Z"/></clipPath>
          <clipPath id="bin-c-clip"><path d="M210 40 H290 V140 L265 170 H235 L210 140 Z"/></clipPath>
          <clipPath id="hop-clip"><path d="M680 110 H820 V270 L775 310 H725 L680 270 Z"/></clipPath>
        </defs>

        <!-- BIN-101 (bin A) and its gate XV-102 -->
        <g id="bin-a">

        <path id="bin-shell" d="M20 40 H100 V140 L75 170 H45 L20 140 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="60" y="20" text-anchor="middle" font-weight="600">Bin A<title>Storage bin A (BIN-101): bulk material waiting to be moved. The line draws from one bin at a time: the source bin chosen before Start.</title></text>
        <text x="60" y="33" text-anchor="middle" font-size="10" fill="var(--muted)">BIN-101</text>
        <text id="lt101" x="60" y="100" text-anchor="middle" font-size="12"></text>
        <text x="60" y="114" text-anchor="middle" font-size="10" fill="var(--muted)">LT-101</text>
        <g id="lsl101"><title>LSL-101, bin A's low-level switch: lights when the bin is nearly empty (below 10 %). A start from this bin is refused then.</title><circle cx="106" cy="158" r="6" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="106" y="176" font-size="10" text-anchor="middle" fill="var(--muted)">low</text></g>
        <line x1="60" y1="170" x2="60" y2="178" stroke="var(--line)" stroke-width="2.5"/>
        <path id="xv102" d="M48 178 L72 178 L60 191 Z M48 204 L72 204 L60 191 Z" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"><title>XV-102, bin A's gate: opens to let material drop onto the feeder. Limit switches confirm when it's fully open or closed.</title></path>
        <text x="60" y="218" text-anchor="middle" font-size="10" fill="var(--muted)">Gate XV-102</text>
        <text id="xv102-txt" x="60" y="231" text-anchor="middle" font-size="10" fill="var(--muted)"></text>
        </g>

        <!-- BIN-111 (bin B) and its gate XV-112 -->
        <g id="bin-b">
        <g clip-path="url(#bin-b-clip)"><rect id="bin-b-fill" x="115" y="170" width="80" height="0" fill="var(--material)"/></g>
        <path id="bin-b-shell" d="M115 40 H195 V140 L170 170 H140 L115 140 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="155" y="20" text-anchor="middle" font-weight="600">Bin B<title>Storage bin B (BIN-111): bulk material waiting to be moved. The line draws from one bin at a time: the source bin chosen before Start.</title></text>
        <text x="155" y="33" text-anchor="middle" font-size="10" fill="var(--muted)">BIN-111</text>
        <text id="lt111" x="155" y="100" text-anchor="middle" font-size="12"></text>
        <text x="155" y="114" text-anchor="middle" font-size="10" fill="var(--muted)">LT-111</text>

        <line x1="155" y1="170" x2="155" y2="178" stroke="var(--line)" stroke-width="2.5"/>
        <path id="xv112" d="M143 178 L167 178 L155 191 Z M143 204 L167 204 L155 191 Z" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"><title>XV-112, bin B's gate: opens to let material drop onto the feeder. Limit switches confirm when it's fully open or closed.</title></path>
        <text x="155" y="218" text-anchor="middle" font-size="10" fill="var(--muted)">Gate XV-112</text>
        <text id="xv112-txt" x="155" y="231" text-anchor="middle" font-size="10" fill="var(--muted)"></text>
        </g>

        <!-- BIN-121 (bin C) and its gate XV-122 -->
        <g id="bin-c">
        <g clip-path="url(#bin-c-clip)"><rect id="bin-c-fill" x="210" y="170" width="80" height="0" fill="var(--material)"/></g>
        <path id="bin-c-shell" d="M210 40 H290 V140 L265 170 H235 L210 140 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="250" y="20" text-anchor="middle" font-weight="600">Bin C<title>Storage bin C (BIN-121): bulk material waiting to be moved. The line draws from one bin at a time: the source bin chosen before Start.</title></text>
        <text x="250" y="33" text-anchor="middle" font-size="10" fill="var(--muted)">BIN-121</text>
        <text id="lt121" x="250" y="100" text-anchor="middle" font-size="12"></text>
        <text x="250" y="114" text-anchor="middle" font-size="10" fill="var(--muted)">LT-121</text>
        <g id="lsl121"><title>LSL-121, bin C's low-level switch: lights when the bin is nearly empty (below 10 %). A start from this bin is refused then.</title><circle cx="296" cy="158" r="6" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="296" y="176" font-size="10" text-anchor="middle" fill="var(--muted)">low</text></g>
        <line x1="250" y1="170" x2="250" y2="178" stroke="var(--line)" stroke-width="2.5"/>
        <path id="xv122" d="M238 178 L262 178 L250 191 Z M238 204 L262 204 L250 191 Z" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"><title>XV-122, bin C's gate: opens to let material drop onto the feeder. Limit switches confirm when it's fully open or closed.</title></path>
        <text x="250" y="218" text-anchor="middle" font-size="10" fill="var(--muted)">Gate XV-122</text>
        <text id="xv122-txt" x="250" y="231" text-anchor="middle" font-size="10" fill="var(--muted)"></text>
        </g>

        <!-- M-103 feeder -->
        <rect id="feeder-body" x="20" y="246" width="265" height="26" rx="4" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <line id="feeder-flow" x1="32" y1="259" x2="273" y2="259" stroke="var(--material)" stroke-width="4" stroke-dasharray="10 14" opacity="0"/>
        <circle id="m103" cx="55" cy="300" r="18" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text id="m103-l" x="55" y="305" text-anchor="middle" font-weight="700" font-size="14">M</text>
        <line x1="55" y1="282" x2="75" y2="272" stroke="var(--line)" stroke-width="2"/>
        <text x="80" y="300" font-size="13" font-weight="600">Feeder <tspan font-size="11" font-weight="400" fill="var(--muted)">M-103</tspan><title>The feeder: a motor-driven screw that meters material from the bin onto the conveyor.</title></text>
        <text id="m103-txt" x="80" y="316" font-size="12" fill="var(--muted)"></text>

        <!-- M-104 conveyor (inclined) -->
        <path id="conv-belt" d="M285 280 L660 120" stroke="var(--line)" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path d="M285 280 L660 120" stroke="var(--hollow)" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path id="conv-flow" d="M285 280 L660 120" stroke="var(--material)" stroke-width="5" stroke-dasharray="10 14" fill="none" opacity="0"/>
        <circle id="m104" cx="640" cy="170" r="18" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text id="m104-l" x="640" y="175" text-anchor="middle" font-weight="700" font-size="14">M</text>
        <text x="455" y="250" font-size="13" font-weight="600">Conveyor <tspan font-size="11" font-weight="400" fill="var(--muted)">M-104</tspan><title>The conveyor: a belt that carries material up into the hopper.</title></text>
        <text id="m104-txt" x="455" y="266" font-size="12" fill="var(--muted)"></text>
        <text id="m104-io" x="455" y="281" font-size="11" fill="var(--muted)"><title>IT-104, the conveyor motor current (full load 12 A), and FT-104, the belt scale at the conveyor head.</title></text>
        <g id="zss104"><title>ZSS-104, the belt motion switch: lit when the belt is actually moving. A motor can run while a belt slips, so the controller checks both.</title><circle cx="380" cy="205" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="370" y="209" font-size="11" text-anchor="end" fill="var(--muted)">moving</text></g>

        <!-- WT-105 hopper -->
        <g clip-path="url(#hop-clip)"><rect id="hop-fill" x="680" y="310" width="140" height="0" fill="var(--material)"/></g>
        <line id="lshh-mark" x1="672" x2="828" stroke="var(--trip)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line id="lsh-mark" x1="672" x2="828" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path id="hop-shell" d="M680 110 H820 V270 L775 310 H725 L680 270 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="750" y="100" text-anchor="middle" font-weight="600">Hopper<title>The hopper: the destination. It's weighed continuously (WT-105) and has two level switches: high (80 %, where the feeder pauses) and high-high (95 %, where the line trips).</title></text>
        <text id="wt105" x="690" y="298" text-anchor="end" font-size="13"></text>
        <text x="690" y="313" text-anchor="end" font-size="11" fill="var(--muted)">hopper weight · WT-105</text>
        <!-- XV-106: the hopper's outlet gate (master specification, item 7) -->
        <g id="outlet">
        <line x1="750" y1="310" x2="750" y2="316" stroke="var(--line)" stroke-width="2.5"/>
        <path id="xv106" d="M738 316 L762 316 L750 328 Z M738 340 L762 340 L750 328 Z" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"><title>XV-106, the hopper's outlet gate: material leaves the hopper only through it. A batch holds it shut while loading, then opens it to discharge.</title></path>
        <text x="772" y="327" font-size="10" fill="var(--muted)">Outlet XV-106</text>
        <text id="xv106-txt" x="772" y="340" font-size="10" fill="var(--muted)"></text>
        <line id="discharge-flow" x1="750" y1="341" x2="750" y2="358" stroke="var(--material)" stroke-width="5" stroke-dasharray="6 6" opacity="0"/>
        </g>
        <g id="lsh105"><title>LSH-105, the high level switch (80 %): the feeder pauses here.</title><circle cx="840" cy="0" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="851" y="4" font-size="11" fill="var(--muted)">high</text></g>
        <g id="lshh105"><title>LSHH-105, the high-high level switch (95 %): the line trips here to prevent an overflow.</title><circle cx="840" cy="0" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="851" y="4" font-size="11" fill="var(--muted)">high-high</text></g>

        <!-- ES-001 -->
        <circle id="es001" cx="850" cy="40" r="20" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text x="850" y="45" text-anchor="middle" font-size="11" font-weight="700" id="es001-l">E-STOP</text>
        <text x="850" y="76" text-anchor="middle" font-size="12" fill="var(--muted)">ES-001<title>The emergency stop. Red when pressed: every motor stops and the gate closes at once.</title></text>
      </svg>
      <div class="legend">
        <span class="l-run">running / open</span><span class="l-off">stopped / closed</span>
        <span class="l-disc">told to move, not confirmed yet</span><span class="l-trip">tripped</span>
        <span class="l-hint">Hover anything on the picture for what it is.</span>
      </div>
