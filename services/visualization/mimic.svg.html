<!-- Shared line mimic (Phase 6): included by replay_template.html and live_template.html via page.py. -->
      <svg id="mimic" viewBox="0 0 900 360" role="img" aria-label="Line mimic: bin, gate, feeder, conveyor, hopper">
        <defs>
          <clipPath id="bin-clip"><path d="M40 30 H170 V150 L125 190 H85 L40 150 Z"/></clipPath>
          <clipPath id="hop-clip"><path d="M680 110 H820 V270 L775 310 H725 L680 270 Z"/></clipPath>
        </defs>

        <!-- BIN-101 -->
        <g clip-path="url(#bin-clip)"><rect id="bin-fill" x="40" y="190" width="130" height="0" fill="var(--material)"/></g>
        <path id="bin-shell" d="M40 30 H170 V150 L125 190 H85 L40 150 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="105" y="22" text-anchor="middle" font-weight="600">Bin <tspan font-size="11" font-weight="400" fill="var(--muted)">BIN-101</tspan><title>The storage bin: bulk material (think grain or gravel) waiting to be moved.</title></text>
        <text id="lt101" x="182" y="92" font-size="13"></text>
        <text x="182" y="108" font-size="11" fill="var(--muted)">bin level · LT-101</text>
        <g id="lsl101"><title>LSL-101, the bin's low-level switch: lights when the bin is nearly empty (below 10 %). The line won't start then.</title><circle cx="30" cy="140" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="22" y="163" font-size="11" text-anchor="middle" fill="var(--muted)">low</text></g>

        <!-- XV-102 gate (bowtie valve, vertical flow) -->
        <line x1="105" y1="190" x2="105" y2="205" stroke="var(--line)" stroke-width="2.5"/>
        <path id="xv102" d="M91 205 L119 205 L105 219 Z M91 233 L119 233 L105 219 Z" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text x="128" y="224" font-size="13" font-weight="600">Gate <tspan font-size="11" font-weight="400" fill="var(--muted)">XV-102</tspan><title>The bin gate: opens to let material drop onto the feeder. Limit switches confirm when it's fully open or closed.</title></text>
        <text id="xv102-txt" x="128" y="240" font-size="12" fill="var(--muted)"></text>

        <!-- M-103 feeder -->
        <rect id="feeder-body" x="70" y="246" width="200" height="26" rx="4" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <line id="feeder-flow" x1="82" y1="259" x2="258" y2="259" stroke="var(--material)" stroke-width="4" stroke-dasharray="10 14" opacity="0"/>
        <circle id="m103" cx="55" cy="300" r="18" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text id="m103-l" x="55" y="305" text-anchor="middle" font-weight="700" font-size="14">M</text>
        <line x1="55" y1="282" x2="75" y2="272" stroke="var(--line)" stroke-width="2"/>
        <text x="80" y="300" font-size="13" font-weight="600">Feeder <tspan font-size="11" font-weight="400" fill="var(--muted)">M-103</tspan><title>The feeder: a motor-driven screw that meters material from the bin onto the conveyor.</title></text>
        <text id="m103-txt" x="80" y="316" font-size="12" fill="var(--muted)"></text>

        <!-- M-104 conveyor (inclined) -->
        <path id="conv-belt" d="M285 280 L660 120" stroke="var(--line)" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path d="M285 280 L660 120" stroke="var(--hollow)" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path id="conv-flow" d="M285 280 L660 120" stroke="var(--material)" stroke-width="5" stroke-dasharray="10 14" fill="none" opacity="0"/>
        <circle id="m104" cx="640" cy="170" r="18" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text id="m104-l" x="640" y="175" text-anchor="middle" font-weight="700" font-size="14">M</text>
        <text x="455" y="250" font-size="13" font-weight="600">Conveyor <tspan font-size="11" font-weight="400" fill="var(--muted)">M-104</tspan><title>The conveyor: a belt that carries material up into the hopper.</title></text>
        <text id="m104-txt" x="455" y="266" font-size="12" fill="var(--muted)"></text>
        <g id="zss104"><title>ZSS-104, the belt motion switch: lit when the belt is actually moving. A motor can run while a belt slips, so the controller checks both.</title><circle cx="380" cy="205" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="370" y="209" font-size="11" text-anchor="end" fill="var(--muted)">moving</text></g>

        <!-- WT-105 hopper -->
        <g clip-path="url(#hop-clip)"><rect id="hop-fill" x="680" y="310" width="140" height="0" fill="var(--material)"/></g>
        <line id="lshh-mark" x1="672" x2="828" stroke="var(--trip)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line id="lsh-mark" x1="672" x2="828" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path id="hop-shell" d="M680 110 H820 V270 L775 310 H725 L680 270 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        <text x="750" y="100" text-anchor="middle" font-weight="600">Hopper<title>The hopper: the destination. It's weighed continuously (WT-105) and has two level switches: high (80 %, where the feeder pauses) and high-high (95 %, where the line trips).</title></text>
        <text id="wt105" x="750" y="336" text-anchor="middle" font-size="13"></text>
        <text x="750" y="352" text-anchor="middle" font-size="11" fill="var(--muted)">hopper weight · WT-105</text>
        <g id="lsh105"><title>LSH-105, the high level switch (80 %): the feeder pauses here.</title><circle cx="840" cy="0" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="851" y="4" font-size="11" fill="var(--muted)">high</text></g>
        <g id="lshh105"><title>LSHH-105, the high-high level switch (95 %): the line trips here to prevent an overflow.</title><circle cx="840" cy="0" r="7" stroke="var(--line)" stroke-width="2" fill="var(--hollow)"/>
          <text x="851" y="4" font-size="11" fill="var(--muted)">high-high</text></g>

        <!-- ES-001 -->
        <circle id="es001" cx="850" cy="40" r="20" stroke="var(--line)" stroke-width="2.5" fill="var(--hollow)"/>
        <text x="850" y="45" text-anchor="middle" font-size="11" font-weight="700" id="es001-l">E-STOP</text>
        <text x="850" y="76" text-anchor="middle" font-size="12" fill="var(--muted)">ES-001<title>The emergency stop. Red when pressed: every motor stops and the gate closes at once.</title></text>
      </svg>
      <div class="legend">
        <span class="l-run">running / open</span><span class="l-off">stopped / closed</span>
        <span class="l-disc">told to move, not confirmed yet</span><span class="l-trip">tripped</span>
        <span class="l-hint">Hover anything on the picture for what it is.</span>
      </div>
