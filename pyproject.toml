[project]
name = "controllab"
version = "0.1.0"
description = "Virtual commissioning and control-system test environment for industrial automation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]
