[project]
name = "controllab"
version = "0.1.0"
description = "Virtual commissioning and control-system test environment for industrial automation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
controllab = "services.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pymodbus>=3.10,<4"]  # pymodbus: interop tests only, never imported at runtime
# Optional AI engineering assistance (Phase 8). Never needed for simulation,
# control, testing, protocols, or the dashboard.
ai = ["anthropic>=1.8,<2"]
# Optional OPC UA server (services/protocols/opcua_server.py). MQTT needs
# nothing: its client is stdlib.
opcua = ["asyncua>=1.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.setuptools.package-data]
"services.visualization" = ["*.html", "*.css", "*.js"]
