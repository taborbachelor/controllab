name: Feeder Jam Recovery -- Reset Refused Until The Jam Is Cleared
description: "A feeder jam trips the line; reset is refused while the chute is plugged; the line recovers only through the correct operator sequence."
title: "The jam trips the line: feed stops at once, the conveyor keeps running to clear the belt"

given:
  line_state: running

when:
  feeder_jam: true

expect:
  line_state: faulted
  fault_reason: "feeder jam"
  feeder_run_commanded: false
  conveyor_run_commanded: true
  gate_open_commanded: false

within:
  seconds: 1.0

then:
  # The chute is still plugged: reset is refused, and says so
  # (CAUSE_STANDING, 2026-09-26; before that, only the ack consumed in the
  # same scan could prove the reset had been evaluated).
  - title: "Reset is refused while the chute is still plugged"
    when:
      acknowledge: true
      reset: true
    expect:
      line_state: faulted
      fault_reason: "feeder jam"
      any_unacknowledged_trip: false
      start_inhibit: ["CAUSE_STANDING"]
    within:
      seconds: 1.0
  - title: "The conveyor runs the belt empty, then stops"
    expect:
      conveyor_run_commanded: false
      belt_empty: true
      line_state: faulted
    within:
      seconds: 3.0
  # Clear the jam at the feeder: the plug switch drops, the acknowledged
  # alarm goes out.
  - title: "Clearing the jam at the feeder clears the alarm"
    when:
      feeder_jam: false
    expect:
      latched_alarm_ids: []
    within:
      seconds: 1.0
  - title: "Reset is accepted once the cause is gone"
    when:
      reset: true
    expect:
      line_state: idle
      start_inhibit: ["NONE"]
    within:
      seconds: 1.0
  # Restart: material flows again.
  - title: "The line restarts and material flows"
    when:
      start: true
    expect:
      line_state: running
      feeder_flowing: true
    within:
      seconds: 3.0

interlock: "Feeder jam"
