name: Hopper Weight Failure Recovery -- Reset Refused Until The Signal Is Restored
description: "The hopper weight transmitter loses its signal; the line trips (unknown means stop) and cannot be reset until the instrument is repaired."
title: "The lost signal trips the line and every output drops"

given:
  line_state: running

when:
  sensor_failed: "WT-105"

expect:
  line_state: faulted
  fault_reason: "hopper weight signal failed"
  feeder_run_commanded: false
  conveyor_run_commanded: false
  gate_open_commanded: false

within:
  seconds: 0.5

then:
  # Signal still lost: reset refused (the ack proves it was evaluated).
  - title: "Reset is refused while the signal is still lost"
    when:
      acknowledge: true
      reset: true
    expect:
      line_state: faulted
      any_unacknowledged_trip: false
    within:
      seconds: 1.0
  # Repair the transmitter: the reading is true again and the alarm goes out.
  - title: "Repairing the transmitter restores a true reading and clears the alarm"
    when:
      sensor_restored: "WT-105"
    expect:
      hopper_weight_agrees: true
      latched_alarm_ids: []
    within:
      seconds: 1.0
  # Start waits for every gate to show closed (the gates-closed permissive):
  # after the trip the gate takes its travel time to close.
  - title: "Reset is accepted once the signal is back, and the gates show closed"
    when:
      reset: true
    expect:
      line_state: idle
      gates_closed: true
    within:
      seconds: 1.0
  - title: "The line restarts and material flows"
    when:
      start: true
    expect:
      line_state: running
      feeder_flowing: true
    within:
      seconds: 3.0

interlock: "Hopper weight signal healthy"
