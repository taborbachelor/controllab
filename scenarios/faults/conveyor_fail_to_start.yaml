name: Conveyor Fails To Prove Running

# Two stages, because the field evidence of this fault is a sequence: the conveyor is commanded to run,
# then -- once it never proves -- every output is dropped. The final field
# state alone (everything off) would look exactly like a start never pressed.

given:
  line_state: idle
  conveyor_fail_to_start: true

when:
  start: true

expect:
  conveyor_run_commanded: true

within:
  seconds: 0.5

then:
  - expect:
      line_state: faulted
      fault_reason: "conveyor failed to prove running"
      feeder_run_commanded: false
      conveyor_run_commanded: false
      gate_open_commanded: false
    within:
      seconds: 3.0

interlock: "Any motor fail-to-start / trip"
