name: Feeder Trip Recovery -- Reset Refused Until The Drive Is Reset
description: "The feeder's motor drive faults; reset is refused until the drive itself is reset at the field."
title: "The drive fault trips the line: feed stops at once, the conveyor keeps running to clear the belt"

# The full recovery procedure a commissioning engineer walks through after a
# trip, as stages (then:). Each stage is applied once the previous one's
# expectations hold, the way an operator acts on what the HMI shows.

given:
  line_state: running

when:
  feeder_trip: true

expect:
  line_state: faulted
  fault_reason: "feeder trip"
  feeder_run_commanded: false
  conveyor_run_commanded: true
  gate_open_commanded: false

within:
  seconds: 0.5

then:
  # Reset is refused while the drive itself is still faulted, and the
  # refusal says why (CAUSE_STANDING, 2026-09-26). The ack in the same press
  # was, before that, the only proof the reset had been evaluated.
  - title: "Reset is refused while the drive is still faulted"
    when:
      acknowledge: true
      reset: true
    expect:
      line_state: faulted
      any_unacknowledged_trip: false
      start_inhibit: ["CAUSE_STANDING"]
    within:
      seconds: 1.0
  # Clear the cause and reset the drive at the field; its (acknowledged)
  # alarm goes out once the healthy drive is seen.
  - title: "The conveyor runs the belt empty, then stops"
    expect:
      conveyor_run_commanded: false
      belt_empty: true
      line_state: faulted
    within:
      seconds: 3.0
  - title: "Clearing the fault and resetting the drive clears the alarm"
    when:
      feeder_trip: false
      feeder_drive_reset: true
    expect:
      latched_alarm_ids: []
    within:
      seconds: 1.0
  # Only then reset the line. Pressing reset in the same moment as the field
  # reset races the drive's feedback: the controller can evaluate it against
  # a still-faulted drive and refuse it (a one-shot command, so it's lost).
  - title: "Reset is accepted once the drive is healthy"
    when:
      reset: true
    expect:
      line_state: idle
      fault_reason: null
    within:
      seconds: 1.0
  - title: "The line restarts"
    when:
      start: true
    expect:
      line_state: running
      feeder_running: true
    within:
      seconds: 3.0

interlock: "Any motor fail-to-start / trip"
