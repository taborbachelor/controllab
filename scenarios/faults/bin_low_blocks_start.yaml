name: Start Refused When Bin Low

given:
  line_state: idle
  bin_level_pct: 5.0

when:
  start: true

# start_inhibit is set only when a start request is evaluated and refused
# (StartInhibit, services/control/line_state.py): it proves START was
# actually issued, and why it was refused. Without it this scenario passed
# even with `when: start` removed (found by the Phase 8 review gate).
expect:
  line_state: idle
  start_inhibit: ["BIN_LOW"]

within:
  seconds: 0.3

interlock: "Bin not low"
