name: Feeder Fails To Prove Running

# Two stages, because the field evidence of this fault is a sequence: the start sequence reaches the feeder (conveyor proven, gate open) and commands it,
# then -- once it never proves -- every output is dropped. The final field
# state alone (everything off) would look exactly like a start never pressed.

given:
  line_state: idle
  feeder_fail_to_start: true

when:
  start: true

expect:
  feeder_run_commanded: true

within:
  seconds: 3.0

then:
  - expect:
      line_state: faulted
      fault_reason: "feeder failed to prove running"
      feeder_run_commanded: false
      conveyor_run_commanded: true
      gate_open_commanded: false
    within:
      seconds: 5.0
  - title: "The conveyor runs the belt empty, then stops"
    expect:
      conveyor_run_commanded: false
      belt_empty: true
      line_state: faulted
    within:
      seconds: 3.0

interlock: "Any motor fail-to-start / trip"
