name: Hopper High-High Faults The Line While Running

given:
  line_state: running

when:
  hopper_level_pct: 97.5

expect:
  line_state: faulted
  fault_reason: "hopper high-high"
  feeder_running: false
  gate_open: false
  feeder_run_commanded: false
  conveyor_run_commanded: false
  gate_open_commanded: false

within:
  seconds: 0.5

interlock: "Hopper high-high"
