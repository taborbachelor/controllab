name: Belt Slip Stops The Feeder And Faults The Line

given:
  line_state: running

when:
  belt_slip: true

expect:
  line_state: faulted
  fault_reason: "conveyor lost confirmation"
  feeder_running: false
  feeder_run_commanded: false
  conveyor_run_commanded: false
  gate_open_commanded: false

within:
  seconds: 0.5

interlock: "Conveyor proven running"
