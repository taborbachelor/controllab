name: Feeder Trip While Running Faults The Line

given:
  line_state: running

when:
  feeder_trip: true

expect:
  line_state: faulted
  fault_reason: "feeder trip"
  feeder_run_commanded: false
  conveyor_run_commanded: true
  gate_open_commanded: false

within:
  seconds: 0.5

interlock: "Any motor fail-to-start / trip"
