# The same line at the addresses a remote-I/O layout with per-table offsets
# would put it (Phase 9 step 4): discrete inputs from 1000, input registers
# from 2000, coils from 3000, holding registers from 4000, the HMI request
# word at 4100, SCADA pushbuttons from 3100. Every range keeps its internal
# ORDER, which is what lets examples/openplc/controllab_line.st run against
# it unchanged: OpenPLC packs each polled range into %IX100.0 / %QX100.0 /
# %IW100 / %QW100 in order, so only the PLC's I/O configuration (its slave
# device start addresses) changes, never the program. Reordering points
# inside a range would need the program's located variables changed too.
name: Relocated remote-I/O layout

discrete_inputs:
  1000: LSL-101
  1001: ZSO-102
  1002: ZSC-102
  1003: M-103.RUNNING
  1004: M-103.FAULT
  1005: M-104.RUNNING
  1006: M-104.OL
  1007: ZSS-104
  1008: LSH-105
  1009: LSHH-105
  1010: ES-001
  1011: LSH-103
  1012: WT-105.FLT
  1013: LSL-111
  1014: ZSO-112
  1015: ZSC-112
  1016: LSL-121
  1017: ZSO-122
  1018: ZSC-122
  1019: ZSO-106
  1020: ZSC-106
  1021: DS-107.READY

input_registers:
  2000: {tag: LT-101, scale: 100, full_scale: 100}
  2001: {tag: WT-105, scale: 10, full_scale: 2000}
  2002: {tag: IT-104, scale: 100, full_scale: 100}
  2003: {tag: FT-104, scale: 100, full_scale: 10}
  2004: {tag: LT-111, scale: 100, full_scale: 100}
  2005: {tag: LT-121, scale: 100, full_scale: 100}

coils:
  3000: XV-102.CMD_OPEN
  3001: M-103.RUN
  3002: M-104.RUN
  3003: XV-112.CMD_OPEN
  3004: XV-122.CMD_OPEN
  3005: XV-106.CMD_OPEN

holding_registers:
  4000: {tag: SC-103, scale: 100, full_scale: 100}

hmi:
  request: 4100
  ack: 4006
  commands:
    start: 3100
    stop: 3101
    reset: 3102
    acknowledge: 3103
    select_auto: 3104
    select_manual: 3105
    start_conveyor: 3106
    stop_conveyor: 3107
    open_gate: 3108
    close_gate: 3109
    start_feeder: 3110
    stop_feeder: 3111
    select_batch: 3112
    open_outlet: 3113
    close_outlet: 3114
  setpoints:
    source_bin: 4101
    recipe_a_kg: 4102
    recipe_b_kg: 4103
    recipe_c_kg: 4104
    hold_s: 4105

status:
  line_state: 4001
  fault_reason: 4002
  alarms_active: 4003
  alarms_unacked: 4004
  first_out: 4005
  start_inhibit: 4007
  mode: 4008
  alarms_active_2: 4009
  alarms_unacked_2: 4010
  source_bin: 4011
  active_bin: 4012
  batch_loaded_kg: 4013
  batches_completed: 4014
